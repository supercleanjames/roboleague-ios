workflows:
  roboleague-ios:
    name: RoboLeague iOS - TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: Codemagic iOS Builds
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.jrwtech.roboleague
      vars:
        BUNDLE_ID: com.jrwtech.roboleague
        XCODE_PROJECT: RoboLeague.xcodeproj
        XCODE_SCHEME: RoboLeague
        CM_TEAM_ID: JPS5HW9782
    scripts:
      - name: Set Xcode version
        script: xcode-select -p
      - name: Build and archive
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath build/RoboLeague.xcarchive \
            -sdk iphoneos \
            archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=$CM_TEAM_ID \
            PROVISIONING_PROFILE_SPECIFIER="RoboLeague_AppStore" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            SDKROOT=iphoneos
      - name: Export IPA
        script: |
          xcodebuild \
            -exportArchive \
            -archivePath build/RoboLeague.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath build/ipa
    artifacts:
      - build/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - External Testers
